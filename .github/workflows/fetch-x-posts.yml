name: Fetch X Posts

on:
  workflow_dispatch:
    inputs:
      x_api_fetch_enabled:
        description: "Set true to enable X API fetch (billing resumes)"
        type: boolean
        default: false

concurrency:
  group: kumamoto-x-fetch
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      X_API_FETCH_ENABLED: ${{ github.event.inputs.x_api_fetch_enabled == true && 'true' || 'false' }}
    outputs:
      fetch_status: ${{ steps.fetch.outputs.fetch_status }}
      dispatch_portal: ${{ steps.fetch.outputs.fetch_status == 'success' }}
    steps:
      - name: Log workflow trigger
        run: |
          echo "WORKFLOW_TRIGGER=${{ github.event_name }}"
          echo "WORKFLOW_RUN_ID=${{ github.run_id }}"
          echo "X_API_FETCH_ENABLED=${X_API_FETCH_ENABLED}"
          echo "SCHEDULED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pre-fetch tests
        if: env.X_API_FETCH_ENABLED == 'true'
        run: npm run test:pre-fetch

      - name: Verify API token is configured
        if: env.X_API_FETCH_ENABLED == 'true'
        env:
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
        run: |
          if [ -z "$X_API_BEARER_TOKEN" ]; then
            echo "X_API_TOKEN_CONFIGURED=false"
            exit 1
          fi
          echo "X_API_TOKEN_CONFIGURED=true"

      - name: Fetch X posts
        id: fetch
        env:
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
        run: |
          set +e
          npm run fetch:x | tee /tmp/fetch-x.log
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q 'FETCH_STATUS=SKIPPED' /tmp/fetch-x.log; then
            echo "fetch_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi
          echo "fetch_status=success" >> "$GITHUB_OUTPUT"

      - name: Commit data changes
        if: success() && steps.fetch.outputs.fetch_status == 'success'
        id: commit
        env:
          DATA_FILES: data/posts.json data/fetch-state.json data/source-runtime.json data/api-usage.json data/feed-status.json
        run: |
          if git diff --quiet -- $DATA_FILES 2>/dev/null && \
             [ -z "$(git status --porcelain -- $DATA_FILES)" ]; then
            echo "NO_DATA_CHANGES"
            echo "COMMIT_SKIPPED=true"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DATA_FILES
          if git diff --cached --quiet; then
            echo "NO_DATA_CHANGES"
            echo "COMMIT_SKIPPED=true"
            exit 0
          fi
          git commit -m "chore(data): update official X posts"
          COMMIT_SHA=$(git rev-parse HEAD)
          npx --yes tsx scripts/stamp-feed-status-commit.ts "$COMMIT_SHA"
          git add data/feed-status.json
          git commit --amend --no-edit
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          git push

      - name: Build site
        if: success() && steps.fetch.outputs.fetch_status == 'success'
        run: npm run build

      - name: Validate production data
        if: success() && steps.fetch.outputs.fetch_status == 'success'
        run: npm run test:production-data

      - name: Commit failure monitoring state
        if: failure() && env.X_API_FETCH_ENABLED == 'true'
        env:
          FAILURE_FILES: data/fetch-state.json data/source-runtime.json data/feed-status.json
        run: |
          if git diff --quiet -- $FAILURE_FILES 2>/dev/null && \
             [ -z "$(git status --porcelain -- $FAILURE_FILES)" ]; then
            echo "NO_FAILURE_STATE_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FAILURE_FILES
          if git diff --cached --quiet; then
            echo "NO_FAILURE_STATE_CHANGES"
            exit 0
          fi
          git commit -m "chore(data): record X fetch failure state"
          git push

  dispatch-portal:
    needs: fetch
    if: needs.fetch.outputs.dispatch_portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portal x-feed sync
        env:
          GH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "PORTAL_DISPATCH_TOKEN is required to trigger kumamoto-disaster-portal sync"
            exit 1
          fi
          UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PORTAL_DISPATCH_TARGET=toropoo-web/kumamoto-disaster-portal"
          echo "PORTAL_DISPATCH_EVENT=x-feed-updated"
          echo "PORTAL_DISPATCH_SOURCE=kumamoto-disaster-x-feed"
          echo "PORTAL_DISPATCH_UPDATED_AT=${UPDATED_AT}"
          gh api repos/toropoo-web/kumamoto-disaster-portal/dispatches \
            -f event_type=x-feed-updated \
            -f "client_payload[source]=kumamoto-disaster-x-feed" \
            -f "client_payload[updated_at]=${UPDATED_AT}"
          echo "PORTAL_DISPATCH_SENT=true"
